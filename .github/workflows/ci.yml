name: CI

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "ci-only-secret-key-value-with-more-than-fifty-characters"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      BACKUP_ACTIVE_KEY_ID: "ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check fakeaccount fakeaccountapp scripts manage.py
      - run: python manage.py check
      - name: Check production settings
        run: python manage.py check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-production-validation-secret-value-with-more-than-fifty-characters"
          DJANGO_ALLOWED_HOSTS: "example.test"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://example.test"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          BACKUP_ACTIVE_KEY_ID: "ci"
          BACKUP_ENCRYPTION_KEYS: "ci:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test
