name: fakeaccount

x-app-environment: &app-environment
  DJANGO_DEBUG: "True"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Copy .env.compose.example to .env.compose and set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  DJANGO_SECURE_SSL_REDIRECT: "False"
  DJANGO_DATABASE: postgres
  POSTGRES_DB: ${POSTGRES_DB:-fakeaccount}
  POSTGRES_USER: ${POSTGRES_USER:-fakeaccount}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  BACKUP_ACTIVE_KEY_ID: ${BACKUP_ACTIVE_KEY_ID:-primary}
  BACKUP_MAX_ATTEMPTS: ${BACKUP_MAX_ATTEMPTS:-5}
  BACKUP_ENCRYPTION_KEYS: ${BACKUP_ENCRYPTION_KEYS:?Set BACKUP_ENCRYPTION_KEYS in .env.compose}
  SECURE_BACKUP_DIR: /app/secure_backups

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fakeaccount}
      POSTGRES_USER: ${POSTGRES_USER:-fakeaccount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: ["/bin/sh", "-c", "python manage.py migrate --noinput && exec gunicorn fakeaccount.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -"]
    environment: *app-environment
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - backup-data:/app/secure_backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backup-worker:
    build: .
    command: ["python", "manage.py", "process_backups"]
    environment: *app-environment
    volumes:
      - backup-data:/app/secure_backups
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  backup-data:
